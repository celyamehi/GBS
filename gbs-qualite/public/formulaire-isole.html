<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulaire de Prise de RDV - GBS Qualité</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            line-height: 1.6;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            margin-bottom: 40px;
            color: white;
        }
        
        .header h1 {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 16px;
            text-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            background: linear-gradient(135deg, #ffffff 0%, #e0e7ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .header p {
            font-size: 1.25rem;
            opacity: 0.95;
            max-width: 600px;
            margin: 0 auto;
        }
        
        .form-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .section {
            margin-bottom: 40px;
        }
        
        .section-title {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
            padding-bottom: 12px;
            border-bottom: 2px solid #f3f4f6;
        }
        
        .section-title h2 {
            font-size: 1.5rem;
            font-weight: 600;
            color: #1f2937;
        }
        
        .section-title .icon {
            width: 24px;
            height: 24px;
            color: #7c3aed;
        }
        
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 24px;
        }
        
        .form-group {
            position: relative;
        }
        
        .form-label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            color: #374151;
            margin-bottom: 8px;
        }
        
        .form-label .required {
            color: #ef4444;
            margin-left: 4px;
        }
        
        .form-label .hint {
            color: #6b7280;
            font-size: 0.75rem;
            font-weight: 400;
        }
        
        .input-field, .select-field, .textarea-field {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-size: 0.875rem;
            line-height: 1.5;
            transition: all 0.3s ease;
            background-color: white;
            color: #1f2937;
        }
        
        .input-field:focus, .select-field:focus, .textarea-field:focus {
            outline: none;
            border-color: #7c3aed;
            box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.1);
            transform: translateY(-1px);
        }
        
        .input-field::placeholder, .select-field::placeholder, .textarea-field::placeholder {
            color: #9ca3af;
        }
        
        .textarea-field {
            resize: vertical;
            min-height: 120px;
        }
        
        .message {
            padding: 16px 24px;
            border-radius: 12px;
            margin-bottom: 24px;
            text-align: center;
            font-weight: 500;
            animation: slideIn 0.3s ease;
        }
        
        .message.success {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            box-shadow: 0 10px 15px -3px rgba(16, 185, 129, 0.3);
        }
        
        .message.error {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: white;
            box-shadow: 0 10px 15px -3px rgba(239, 68, 68, 0.3);
        }
        
        .button-group {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-top: 40px;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 14px 32px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1rem;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            position: relative;
            overflow: hidden;
        }
        
        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }
        
        .btn:hover::before {
            left: 100%;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #7c3aed 0%, #6d28d9 100%);
            color: white;
            box-shadow: 0 10px 15px -3px rgba(124, 58, 237, 0.3);
        }
        
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 20px 25px -5px rgba(124, 58, 237, 0.4);
        }
        
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .btn-secondary {
            background: linear-gradient(135deg, #f3f4f6 0%, #e5e7eb 100%);
            color: #374151;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        
        .btn-secondary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2);
        }
        
        .btn-icon {
            width: 20px;
            height: 20px;
        }
        
        .loading-spinner {
            width: 20px;
            height: 20px;
            border: 2px solid transparent;
            border-top: 2px solid currentColor;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        .footer {
            text-align: center;
            margin-top: 40px;
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.875rem;
        }
        
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        .form-card {
            animation: fadeIn 0.6s ease;
        }
        
        @media (max-width: 768px) {
            body {
                padding: 12px;
            }
            
            .header h1 {
                font-size: 2rem;
            }
            
            .form-card {
                padding: 24px;
            }
            
            .form-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            
            .button-group {
                flex-direction: column;
            }
            
            .btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- En-tête moderne -->
        <div class="header">
            <h1>Formulaire de Prise de RDV</h1>
            <p>Remplissez les informations pour enregistrer un nouveau rendez-vous client</p>
        </div>

        <!-- Message de confirmation -->
        <div id="message" class="message hidden"></div>

        <!-- Formulaire moderne -->
        <form id="rdvForm">
            <div class="form-card">
                    <!-- Sélection de l'agent -->
                    <div class="section">
                        <div class="section-title">
                            <i data-lucide="user" class="icon"></i>
                            <h2>Agent</h2>
                        </div>
                        <div class="form-grid">
                            <div class="form-group">
                                <label class="form-label">
                                    Agent <span class="required">*</span>
                                    <span class="hint">(obligatoire)</span>
                                </label>
                                <select id="agent_id" class="select-field" required>
                                    <option value="">Sélectionner un agent</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Projet</label>
                                <select id="projet" class="select-field">
                                    <option value="">Chargement...</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <!-- Informations RDV -->
                    <div class="section">
                        <div class="section-title">
                            <i data-lucide="calendar" class="icon"></i>
                            <h2>Informations du Rendez-vous</h2>
                        </div>
                        <div class="form-grid">
                            <div class="form-group">
                                <label class="form-label">Date prise RDV</label>
                                <input type="date" id="date_prise_rdv" class="input-field">
                            </div>
                            <div class="form-group">
                                <label class="form-label">
                                    Date RDV <span class="required">*</span>
                                    <span class="hint">(obligatoire)</span>
                                </label>
                                <input type="date" id="date_rdv" class="input-field" required>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Heure RDV</label>
                                <input type="time" id="date_heure_rdv" class="input-field">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Type RDV</label>
                                <input type="text" id="type_rdv" class="input-field" placeholder="Type de rendez-vous" value="Téléphonique">
                            </div>
                        </div>
                    </div>

                    <!-- Informations Client -->
                    <div class="mb-8">
                        <h2 class="text-xl font-semibold text-[#1a1a2e] mb-4 flex items-center gap-2">
                            <i data-lucide="user" class="w-5 h-5 text-[#7c3aed]"></i>
                            Informations Client
                        </h2>
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                            <div>
                                <label class="block text-sm font-medium text-[#6b7280] mb-2">
                                    Nom client * <span class="text-xs text-gray-500">(obligatoire)</span>
                                </label>
                                <input type="text" id="nom_client" class="input-field" placeholder="Nom du client" required>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-[#6b7280] mb-2">
                                    Numéro client
                                </label>
                                <input type="tel" id="numero_client" class="input-field" placeholder="06 12 34 56 78">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-[#6b7280] mb-2">
                                    Email
                                </label>
                                <input type="email" id="adresse_email" class="input-field" placeholder="email@exemple.com">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-[#6b7280] mb-2">
                                    Adresse
                                </label>
                                <input type="text" id="adresse" class="input-field" placeholder="123 rue de la République">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-[#6b7280] mb-2">
                                    Code postal
                                </label>
                                <input type="text" id="code_postal" class="input-field" placeholder="75001" maxlength="5">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-[#6b7280] mb-2">
                                    Âge
                                </label>
                                <input type="number" id="age" class="input-field" placeholder="35" min="0" max="120">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-[#6b7280] mb-2">
                                    Nombre de personnes
                                </label>
                                <input type="number" id="nombre_personnes" class="input-field" placeholder="1" min="1">
                            </div>
                        </div>
                    </div>

                    <!-- Informations Mutuelle -->
                    <div class="mb-8">
                        <h2 class="text-xl font-semibold text-[#1a1a2e] mb-4 flex items-center gap-2">
                            <i data-lucide="shield" class="w-5 h-5 text-[#7c3aed]"></i>
                            Informations Mutuelle
                        </h2>
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                            <div>
                                <label class="block text-sm font-medium text-[#6b7280] mb-2">
                                    Mutuelle actuelle
                                </label>
                                <input type="text" id="mutuelle_actuelle" class="input-field" placeholder="Nom de la mutuelle actuelle">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-[#6b7280] mb-2">
                                    Prix actuel (€)
                                </label>
                                <input type="number" id="prix_actuel" class="input-field" placeholder="45.50" step="0.01" min="0">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-[#6b7280] mb-2">
                                    Garantie souhaitée
                                </label>
                                <input type="text" id="garantie" class="input-field" placeholder="Garantie souhaitée">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-[#6b7280] mb-2">
                                    Optique
                                </label>
                                <input type="text" id="optique" class="input-field" placeholder="Couverture optique">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-[#6b7280] mb-2">
                                    Dentaire
                                </label>
                                <input type="text" id="dentaire" class="input-field" placeholder="Couverture dentaire">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-[#6b7280] mb-2">
                                    Dépassements honoraires
                                </label>
                                <input type="text" id="depassements_honoraires" class="input-field" placeholder="Dépassements honoraires">
                            </div>
                        </div>
                    </div>

                    <!-- Santé et Préférences -->
                    <div class="mb-8">
                        <h2 class="text-xl font-semibold text-[#1a1a2e] mb-4 flex items-center gap-2">
                            <i data-lucide="heart" class="w-5 h-5 text-[#7c3aed]"></i>
                            Santé et Préférences
                        </h2>
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                            <div>
                                <label class="block text-sm font-medium text-[#6b7280] mb-2">
                                    ALD
                                </label>
                                <input type="text" id="ald" class="input-field" placeholder="Affection Longue Durée">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-[#6b7280] mb-2">
                                    Médecine douce
                                </label>
                                <input type="text" id="medecine_douce" class="input-field" placeholder="Médecine douce">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-[#6b7280] mb-2">
                                    Hospitalisation
                                </label>
                                <input type="text" id="hospitalisation" class="input-field" placeholder="Type d'hospitalisation">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-[#6b7280] mb-2">
                                    Appareillage
                                </label>
                                <input type="text" id="appareillage" class="input-field" placeholder="Type d'appareillage">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-[#6b7280] mb-2">
                                    Régime
                                </label>
                                <input type="text" id="regime" class="input-field" placeholder="Régime sécurité sociale">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-[#6b7280] mb-2">
                                    Satisfaction actuelle
                                </label>
                                <input type="text" id="satisfaction" class="input-field" placeholder="Niveau de satisfaction">
                            </div>
                        </div>
                    </div>

                    <!-- Remarques -->
                    <div class="mb-8">
                        <h2 class="text-xl font-semibold text-[#1a1a2e] mb-4 flex items-center gap-2">
                            <i data-lucide="file-text" class="w-5 h-5 text-[#7c3aed]"></i>
                            Remarques
                        </h2>
                        <div>
                            <label class="block text-sm font-medium text-[#6b7280] mb-2">
                                Notes additionnelles
                            </label>
                            <textarea id="remarques" class="input-field" rows="4" placeholder="Ajoutez des remarques ou notes importantes..."></textarea>
                        </div>
                    </div>

                    <!-- Boutons d'action -->
                    <div class="button-group">
                        <button type="submit" id="submitBtn" class="btn btn-primary">
                            <i data-lucide="file-text" class="btn-icon"></i>
                            Enregistrer le RDV
                        </button>
                        
                        <button type="button" onclick="resetForm()" class="btn btn-secondary">
                            Réinitialiser
                        </button>
                    </div>
                </div>
            </form>

            <!-- Pied de page moderne -->
            <div class="footer">
                <p>Formulaire de prise de RDV - GBS Qualité</p>
            </div>
        </div>
    </div>

    <script>
        // Configuration Supabase
        const { createClient } = window.supabase;
        const supabaseUrl = 'https://vhcxstidhnenogffwqew.supabase.co';
        const supabaseKey = 'sb_publishable_u1OwKWbBPdYoc5o5t_GNAw_75TJZqQa';
        
        const supabaseClient = createClient(supabaseUrl, supabaseKey);

        // Charger les agents et projets
        async function loadData() {
            try {
                // Charger les agents
                const { data: agents, error: agentsError } = await supabaseClient
                    .from('agents')
                    .select('*')
                    .eq('actif', true)
                    .order('nom');

                if (agentsError) throw agentsError;
                
                const agentSelect = document.getElementById('agent_id');
                agentSelect.innerHTML = '<option value="">Sélectionner un agent</option>';
                
                agents.forEach(agent => {
                    const option = document.createElement('option');
                    option.value = agent.id;
                    option.textContent = agent.nom;
                    agentSelect.appendChild(option);
                });

                // Essayer de charger les projets depuis une table projets, sinon depuis les écoutes
                let projetsUniques = [];
                
                try {
                    // Essayer depuis la table projets
                    const { data: projetsTable, error: projetsTableError } = await supabaseClient
                        .from('projets')
                        .select('nom, actif')
                        .eq('actif', true)
                        .order('nom');

                    if (!projetsTableError && projetsTable) {
                        projetsUniques = projetsTable.map(p => p.nom);
                    } else {
                        // Si la table projets n'existe pas, charger depuis les écoutes
                        const { data: projetsEcoutes, error: projetsEcoutesError } = await supabaseClient
                            .from('ecoutes')
                            .select('projet')
                            .not('projet', 'is', null)
                            .not('projet', 'eq', '');

                        if (!projetsEcoutesError && projetsEcoutes) {
                            projetsUniques = [...new Set(projetsEcoutes.map(p => p.projet))];
                        }
                    }
                } catch (error) {
                    console.log('Table projets non trouvée, utilisation des écoutes...');
                }
                
                const projetSelect = document.getElementById('projet');
                projetSelect.innerHTML = '<option value="">Sélectionner un projet</option>';
                
                // Ajouter les projets trouvés
                projetsUniques.forEach(projet => {
                    const option = document.createElement('option');
                    option.value = projet;
                    option.textContent = projet;
                    projetSelect.appendChild(option);
                });

                // Ajouter les projets fixes connus (toujours disponibles)
                const projetsFixes = ['GBS Conseille', 'CAPSICOM', 'CAP Prevoyance'];
                projetsFixes.forEach(projet => {
                    if (!projetsUniques.includes(projet)) {
                        const option = document.createElement('option');
                        option.value = projet;
                        option.textContent = projet;
                        projetSelect.appendChild(option);
                    }
                });
                
                // Sélectionner "GBS Conseille" par défaut
                projetSelect.value = 'GBS Conseille';

            } catch (error) {
                console.error('Erreur lors du chargement des données:', error);
                showMessage('Erreur lors du chargement des données', 'error');
            }
        }

        // Soumettre le formulaire
        async function submitForm(e) {
            e.preventDefault();
            
            const agentId = document.getElementById('agent_id').value;
            const nomClient = document.getElementById('nom_client').value;
            const dateRdv = document.getElementById('date_rdv').value;
            
            if (!agentId || !nomClient || !dateRdv) {
                showMessage('Veuillez remplir les champs obligatoires', 'error');
                return;
            }

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<div class="loading-spinner"></div> Enregistrement...';

            try {
                const formData = {
                    agent_id: agentId,
                    projet: document.getElementById('projet').value,
                    lien_audio: null,
                    audio_data: null,
                    audio_name: null,
                    date_prise_rdv: document.getElementById('date_prise_rdv').value,
                    date_rdv: dateRdv,
                    statut_rdv: 'En attente',
                    rdv_qualite: false,
                    rdv_honore: null,
                    suivi: null,
                    confirmation: null,
                    note_globale: 5,
                    remarques: document.getElementById('remarques').value || null,
                    numero_client: document.getElementById('numero_client').value || null,
                    nom_client: nomClient || null,
                    
                    // Informations complémentaires RDV
                    adresse: document.getElementById('adresse').value || null,
                    mutuelle_actuelle: document.getElementById('mutuelle_actuelle').value || null,
                    prix_actuel: parseFloat(document.getElementById('prix_actuel').value) || null,
                    garantie: document.getElementById('garantie').value || null,
                    optique: document.getElementById('optique').value || null,
                    dentaire: document.getElementById('dentaire').value || null,
                    depassements_honoraires: document.getElementById('depassements_honoraires').value || null,
                    ald: document.getElementById('ald').value || null,
                    medecine_douce: document.getElementById('medecine_douce').value || null,
                    hospitalisation: document.getElementById('hospitalisation').value || null,
                    appareillage: document.getElementById('appareillage').value || null,
                    regime: document.getElementById('regime').value || null,
                    satisfaction: document.getElementById('satisfaction').value || null,
                    date_heure_rdv: document.getElementById('date_heure_rdv').value || null,
                    type_rdv: document.getElementById('type_rdv').value || null,
                    age: parseInt(document.getElementById('age').value) || null,
                    nombre_personnes: parseInt(document.getElementById('nombre_personnes').value) || null,
                    code_postal: document.getElementById('code_postal').value || null,
                    adresse_email: document.getElementById('adresse_email').value || null
                };

                const { error } = await supabaseClient
                    .from('ecoutes')
                    .insert([formData]);

                if (error) throw error;

                showMessage('✅ RDV enregistré avec succès !', 'success');
                resetForm();
                
            } catch (error) {
                console.error('Erreur lors de l\'enregistrement:', error);
                showMessage('❌ Erreur lors de l\'enregistrement. Veuillez réessayer.', 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i data-lucide="file-text" class="btn-icon"></i> Enregistrer le RDV';
            }
        }

        // Réinitialiser le formulaire
        function resetForm() {
            document.getElementById('rdvForm').reset();
            // Garder les valeurs par défaut
            document.getElementById('projet').value = 'GBS Conseille';
            document.getElementById('type_rdv').value = 'Téléphonique';
            document.getElementById('date_prise_rdv').value = new Date().toISOString().split('T')[0];
        }

        // Afficher un message
        function showMessage(text, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = text;
            messageDiv.className = `message ${type}`;
            messageDiv.classList.remove('hidden');
            
            setTimeout(() => {
                messageDiv.classList.add('hidden');
            }, 5000);
        }

        // Initialiser
        document.addEventListener('DOMContentLoaded', function() {
            loadData();
            
            // Initialiser la date du jour
            document.getElementById('date_prise_rdv').value = new Date().toISOString().split('T')[0];
            
            // Attacher l'événement de soumission
            document.getElementById('rdvForm').addEventListener('submit', submitForm);
        });
    </script>
</body>
</html>
